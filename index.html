<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>심플 달력 메모</title>
    <!-- CryptoJS 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-primary: #D0BCFF;
            --md-on-primary: #381E72;
            --md-primary-container: #4F378B;
            --md-on-primary-container: #EADDFF;
            --md-secondary: #CCC2DC;
            --md-secondary-container: #4A4458;
            --md-error: #F2B8B5;
            --md-error-container: #8C1D18;
            --md-success: #81C995;
            --md-success-container: #0F5132;
            --md-warning-container: #5C4000;

            --md-bg: #000000;
            --md-surface: #000000;
            --md-surface-container: #121212;
            --md-surface-container-high: #1E1E1E;
            --md-surface-variant: #2C2C2C;
            --md-on-surface: #E6E1E5;
            --md-on-surface-variant: #CAC4D0;
            --md-outline: #49454F;
            --md-outline-variant: #2C2C2C;

            --nav-height: 68px;
            --fab-size: 56px;
        }

        * { box-sizing: border-box; }
        *:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

        html, body {
            overscroll-behavior-y: contain;
            /* 여백 스와이프 시 기본 브라우저 제스처 충돌 방지 */
            touch-action: pan-y; 
        }

        body {
            font-family: 'Roboto', 'Noto Sans KR', -apple-system, sans-serif;
            background-color: var(--md-bg);
            margin: 0;
            padding: 0;
            color: var(--md-on-surface);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--nav-height) + 20px);
        }

        /* 잠금 화면 */
        .lock-screen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .lock-card {
            background: #000000;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            border: none;
        }

        .lock-card h2 { margin-top: 0; margin-bottom: 8px; font-size: 1.25rem; color: var(--md-on-surface); }
        .lock-card p { font-size: 0.86rem; color: var(--md-on-surface-variant); margin-bottom: 22px; }

        .lock-card input[type="password"] {
            width: 100%; padding: 14px; border: none; border-bottom: 2px solid var(--md-outline);
            border-radius: 0; font-size: 1rem; margin-bottom: 20px;
            text-align: center; background: transparent; color: var(--md-on-surface);
            font-family: inherit; transition: border-color 0.15s ease;
        }
        .lock-card input[type="password"]:focus { border-bottom-color: var(--md-primary); outline: none; }

        .lock-card button {
            width: 100%; padding: 14px; background: var(--md-primary);
            color: var(--md-on-primary); border: none; border-radius: 100px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;
        }

        .lock-forgot {
            margin-top: 18px;
            font-size: 0.82rem;
            color: var(--md-on-surface-variant);
            text-decoration: underline;
            cursor: pointer;
        }
        .lock-forgot:hover { color: var(--md-on-surface); }

        /* '한 번 더 누르면 종료' 토스트 */
        .exit-toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--nav-height) + 18px);
            transform: translateX(-50%) translateY(10px);
            background: var(--md-surface-container-high);
            color: var(--md-on-surface);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            z-index: 10600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .exit-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 14px 14px 0;
            display: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container input, .container textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* 상단 헤더 */
        header {
            text-align: center;
            padding-bottom: 10px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--md-outline-variant);
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--md-on-surface);
            letter-spacing: 0.1px;
        }

        /* 탭 패널 */
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .tab-panel.slide-from-right { animation: slideFromRight 0.26s cubic-bezier(0.2,0.8,0.2,1); }
        .tab-panel.slide-from-left { animation: slideFromLeft 0.26s cubic-bezier(0.2,0.8,0.2,1); }
        .tab-panel.slide-from-bottom { animation: slideFromBottom 0.26s cubic-bezier(0.2,0.8,0.2,1); }
        .tab-panel.slide-from-top { animation: slideFromTop 0.26s cubic-bezier(0.2,0.8,0.2,1); }

        @keyframes slideFromRight {
            from { transform: translateX(28px); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideFromLeft {
            from { transform: translateX(-28px); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideFromBottom {
            from { transform: translateY(28px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideFromTop {
            from { transform: translateY(-28px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* 패널 박스 테두리 제거 */
        .panel-box {
            background: transparent;
            border-radius: 0;
            padding: 12px 0;
            margin-bottom: 14px;
            border: none;
            box-shadow: none;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--md-on-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .memo-top-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
        }
        .sort-select {
            padding: 6px 12px;
            border: 1px solid var(--md-outline);
            border-radius: 100px;
            background: transparent;
            color: var(--md-on-surface);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .search-panel-box {
            padding: 6px 0;
            margin-bottom: 10px;
        }
        .search-bar { display: flex; gap: 8px; align-items: center; }
        .search-bar input {
            flex-grow: 1; padding: 10px 16px; border: 1px solid var(--md-outline);
            border-radius: 100px; font-size: 0.9rem;
            background: transparent; color: var(--md-on-surface);
            font-family: inherit;
        }
        .search-bar input:focus { outline: 2px solid var(--md-primary); }
        .clear-search-btn {
            background: none; border: none; font-size: 1.4rem;
            font-weight: 700; color: var(--md-on-surface-variant);
            cursor: pointer; padding: 0 6px; line-height: 1;
        }
        .clear-search-btn:hover { color: var(--md-error); }

        .memo-list-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .empty-msg {
            font-size: 0.88rem;
            color: var(--md-on-surface-variant);
            padding: 28px 0;
            text-align: center;
            width: 100%;
        }

        .control-row {
            display: flex; gap: 8px; align-items: center;
            flex-wrap: wrap; margin-bottom: 10px;
        }

        .sort-select {
            border: 1px solid var(--md-outline);
            background: var(--md-surface-container);
            color: var(--md-on-surface);
            padding: 8px 10px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            flex-shrink: 0;
            max-width: 110px;
        }
        .sort-select:focus { outline: 2px solid var(--md-primary); }

        .control-row input[type="date"] {
            padding: 9px 12px; border: 1px solid var(--md-outline);
            border-radius: 12px; font-size: 0.85rem;
            background: transparent; color: var(--md-on-surface);
            font-family: inherit;
        }

        .status-tag {
            font-size: 0.78rem; padding: 4px 10px;
            border-radius: 100px; background: var(--md-surface-variant); color: var(--md-on-surface-variant);
            font-weight: 500;
        }
        .status-tag.active { background: var(--md-success-container); color: var(--md-success); }

        .result-item {
            padding: 10px 8px;
            background: transparent;
            border: none;
            display: flex;
            gap: 10px;
            align-items: center;
            min-height: 38px;
        }
        .result-item.clickable {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .result-item.clickable:hover {
            background-color: var(--md-surface-container-high);
            border-radius: 8px;
        }
        
        .result-date { 
            font-weight: 400; 
            font-size: 0.78rem; 
            color: var(--md-on-surface-variant);
            white-space: nowrap; 
            flex-shrink: 0;
        }

        .item-text {
            font-size: 0.92rem;
            color: var(--md-on-surface);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 달력 테두리 및 박스 제거 */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; background: transparent; padding: 8px 4px;
            border: none; box-shadow: none;
        }
        .calendar-header h2 { 
            margin: 0; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--md-on-surface); 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .year-picker {
            cursor: pointer;
            padding: 1px 6px;
            border-radius: 6px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 0.85rem;
        }
        
        .nav-btn {
            background: transparent; color: var(--md-secondary); border: 1px solid var(--md-outline);
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: 700; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 4px; background: transparent; padding: 4px 0;
            border: none; box-shadow: none;
        }

        .day-header { text-align: center; font-weight: 700; padding: 4px 0; color: var(--md-on-surface-variant); font-size: 0.78rem; }
        .day-header.sunday-color { color: #E57373; }
        .day-header.saturday-color { color: #64B5F6; }

        .day-cell {
            min-height: 56px; background: transparent; border: none;
            border-radius: 12px; padding: 4px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
        }
        .day-cell:hover { background: var(--md-surface-container-high); }
        .day-cell.empty { background: transparent; cursor: default; }
        .day-cell.empty:hover { background: transparent; }

        .day-number {
            font-size: 0.85rem;
            color: var(--md-on-surface);
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .day-number.sunday-color { color: #E57373; }
        .day-number.saturday-color { color: #64B5F6; }
        .day-cell.today .day-number {
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-weight: 700;
        }

        .postit-dot {
            width: 5px; height: 5px; background-color: var(--md-primary);
            border-radius: 50%; margin-top: auto;
        }

        /* 전체 화면 메모 수정 화면 */
        .memo-fullscreen-view {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--md-bg);
            z-index: 1200;
            flex-direction: column;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .memo-fullscreen-header {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--md-outline-variant);
        }
        .memo-fullscreen-header h3 {
            flex: 1;
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--md-on-surface);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-icon-btn {
            width: 38px; height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            background: transparent;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--md-on-surface);
            position: relative;
            overflow: hidden;
        }
        .editor-icon-btn:hover { background: var(--md-surface-container-high); }
        .memo-fullscreen-header #deleteBtn {
            flex-shrink: 0;
            white-space: nowrap;
        }
        .memo-fullscreen-view textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 0;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            background-color: transparent;
            color: var(--md-on-surface);
            resize: none;
            margin-bottom: 12px;
        }
        .memo-fullscreen-view textarea:focus { outline: none; }

        /* 모달 테두리 제거 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center; z-index: 10500;
        }

        .modal {
            background: #000000; padding: 22px; border-radius: 0;
            width: 90%; max-width: 450px; border: none; box-shadow: none;
        }
        .modal h3 { margin-top: 0; font-size: 1.1rem; font-weight: 700; color: var(--md-on-surface); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }

        .btn {
            padding: 10px 18px; border: 1px solid var(--md-outline); border-radius: 100px;
            cursor: pointer; font-weight: 700; font-size: 0.88rem;
            font-family: inherit; background: transparent; color: var(--md-on-surface);
        }
        .btn-primary { background: var(--md-primary); color: var(--md-on-primary); border-color: transparent; }
        .btn-success { background: var(--md-success-container); color: var(--md-success); border-color: transparent; }
        .btn-info { background: var(--md-secondary-container); color: var(--md-secondary); border-color: transparent; }
        .btn-warning { background: var(--md-warning-container); color: #FFD54F; border-color: transparent; }
        .btn-secondary { background: transparent; color: var(--md-on-surface); border-color: var(--md-outline); }
        .btn-danger { background: var(--md-error-container); color: var(--md-error); border-color: transparent; }
        .btn-sm { padding: 7px 14px; font-size: 0.78rem; }

        /* 하단 고정 탭 바 */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom, 0);
            background: var(--md-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 900;
            border-top: 1px solid var(--md-outline-variant);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 100%;
            color: var(--md-on-surface-variant);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 500;
            padding: 0;
        }

        .nav-item .icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .nav-item.active { color: var(--md-primary); font-weight: 700; }

        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(var(--nav-height) + 18px);
            width: var(--fab-size); height: var(--fab-size);
            border-radius: 18px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border: none;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            z-index: 890;
        }
        .fab.show { display: flex; }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .setting-row .setting-label { font-size: 0.9rem; color: var(--md-on-surface); font-weight: 500; }
        .setting-desc { font-size: 0.78rem; color: var(--md-on-surface-variant); margin-top: 2px; }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--md-outline);
            transition: 0.2s;
            border-radius: 26px;
        }
        .switch-slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: var(--md-on-surface-variant);
            transition: 0.2s;
            border-radius: 50%;
        }
        .switch input:checked + .switch-slider {
            background-color: var(--md-primary);
        }
        .switch input:checked + .switch-slider:before {
            transform: translateX(20px);
            background-color: var(--md-on-primary);
        }
    </style>
</head>
<body>

<!-- '뒤로가기 한 번 더 누르면 종료' 안내 토스트 -->
<div id="exitToast" class="exit-toast">한 번 더 누르면 종료됩니다</div>

<!-- 암호 잠금 화면 -->
<div class="lock-screen-overlay" id="lockScreen">
    <div class="lock-card">
        <h2 id="lockTitle">🔒 메모장 잠금 해제</h2>
        <p id="lockDesc">비밀번호를 입력하세요.</p>
        <input type="password" id="appPasswordInput" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') unlockApp()">
        <button onclick="unlockApp()" id="lockBtn">확인</button>
        <div class="lock-forgot" id="lockForgotLink" onclick="resetForgottenPassword()">비밀번호를 잊으셨나요?</div>
    </div>
</div>

<!-- 메인 컨테이너 -->
<div class="container" id="mainContainer">
    <header>
        <h1 id="headerTitle">📅 달력</h1>
    </header>

    <!-- 1탭: 메모 -->
    <div class="tab-panel" id="tabFree">
        <div class="panel-box">
            <div class="memo-top-header">
                <select id="freeMemoSortSelect" class="sort-select" onchange="changeFreeMemoSort()">
                    <option value="date" id="optSortCreated">생성시간순</option>
                    <option value="title" id="optSortTitle1">제목순</option>
                </select>
            </div>
            <div class="memo-list-container" id="freeMemosGrid"></div>
        </div>
    </div>

    <!-- 2탭: 달력 -->
    <div class="tab-panel active" id="tabCalendar">
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonthBtn" onclick="changeMonth(-1)" aria-label="이전달">‹</button>
            <h2 id="currentMonthYear"></h2>
            <button class="nav-btn" id="nextMonthBtn" onclick="changeMonth(1)" aria-label="다음달">›</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 3탭: 검색 -->
    <div class="tab-panel" id="tabSearch">
        <div class="panel-box search-panel-box">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="" oninput="searchMemos()">
                <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()" title="검색 초기화">×</button>
            </div>
        </div>
        <div class="panel-box" id="searchResults" style="display: none;">
            <div class="panel-title" id="searchResultTitle">검색 결과</div>
            <div id="resultsList" class="memo-list-container"></div>
        </div>
    </div>

    <!-- 4탭: 설정 -->
    <div class="tab-panel" id="tabSettings">
        <div class="panel-box">
            <div class="control-row" style="margin-bottom:0;">
                <button class="btn btn-primary" onclick="openAllMemosView()" id="btnAllMemos">모든 메모 보기</button>
                <button class="btn btn-secondary" onclick="openTrashView()" id="btnTrash">🗑️ 휴지통</button>
                <select class="sort-select" id="languageSelect" onchange="changeLanguage(this.value)" aria-label="Language / 언어">
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
        </div>

        <div class="panel-box">

    function showDialog(message, type, isPassword, defaultValue, inputType) {
        return new Promise(function(resolve) {
            const overlay = document.getElementById('customDialogOverlay');
            const msgEl = document.getElementById('customDialogMessage');
            const inputEl = document.getElementById('customDialogInput');
            const okBtn = document.getElementById('customDialogOkBtn');
            const cancelBtn = document.getElementById('customDialogCancelBtn');

            msgEl.textContent = message;
            overlay.style.display = 'flex';

            if (type === 'prompt') {
                inputEl.style.display = 'block';
                inputEl.type = inputType || (isPassword ? 'password' : 'text');
                inputEl.value = defaultValue || '';
                setTimeout(function() { inputEl.focus(); inputEl.select(); }, 50);
            } else {
                inputEl.style.display = 'none';
            }

            cancelBtn.style.display = (type === 'alert') ? 'none' : 'inline-block';

            function cleanup() {
                overlay.style.display = 'none';
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                inputEl.onkeyup = null;
            }

            okBtn.onclick = function() {
                let result;
                if (type === 'prompt') result = inputEl.value.trim() || null;
                else result = true;
                cleanup();
                resolve(result);
            };

            cancelBtn.onclick = function() {
                cleanup();
                resolve(type === 'prompt' ? null : false);
            };

            inputEl.onkeyup = function(e) {
                if (e.key === 'Enter') okBtn.click();
            };
        });
    }

    function customAlert(message) { return showDialog(message, 'alert', false); }
    function customConfirm(message) { return showDialog(message, 'confirm', false); }
    function customPrompt(message, defaultValue) { return showDialog(message, 'prompt', true, defaultValue); }
    function customTextPrompt(message, defaultValue) { return showDialog(message, 'prompt', false, defaultValue, 'text'); }

    function switchTab(tabId, titleText) {
        const previousTabId = activeTabId;
        const prevIndex = tabOrder.indexOf(previousTabId);
        const newIndex = tabOrder.indexOf(tabId);

        document.querySelectorAll('.tab-panel').forEach(panel => {
            panel.classList.remove('active', 'slide-from-right', 'slide-from-left', 'slide-from-bottom', 'slide-from-top');
        });
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.classList.remove('active');
        });

        const activePanel = document.getElementById(tabId);
        activePanel.classList.add('active');

        if (tabId !== previousTabId && prevIndex !== -1 && newIndex !== -1) {
            activePanel.classList.add(newIndex > prevIndex ? 'slide-from-right' : 'slide-from-left');
            activePanel.addEventListener('animationend', function handler() {
                activePanel.classList.remove('slide-from-right', 'slide-from-left', 'slide-from-bottom', 'slide-from-top');
                activePanel.removeEventListener('animationend', handler);
            });
        }

        document.getElementById('headerTitle').textContent = titleText || tabTitles[tabId] || '';
        document.querySelectorAll('.nav-item')[Math.max(newIndex, 0)].classList.add('active');
        document.getElementById('fabAddMemo').classList.toggle('show', tabId === 'tabFree');

        if (tabId === 'tabSearch') {
            document.getElementById('searchInput').focus();
        }

        if (tabId === 'tabCalendar' && previousTabId !== 'tabCalendar') {
            const today = new Date();
            if (currentDate.getFullYear() !== today.getFullYear() || currentDate.getMonth() !== today.getMonth()) {
                currentDate = today;
                renderCalendar();
            }
        }

        activeTabId = tabId;
    }

    }, true);

    function initSwipeNavigation() {
        // [수정] document.body 전체를 대상으로 스와이프를 감지하여 여백/공백 공간에서도 좌우 스와이프가 정상 작동하도록 개선
        const swipeArea = document.body;
        let startX = 0, startY = 0, lastY = 0, tracking = false;
        let gestureMode = null;
        const THRESHOLD = 55;
        const LOCK_THRESHOLD = 10;

        function isInteractiveTarget(target) {
            return !!target.closest('input, textarea, select, .switch, button, .clickable');
        }

        function anyModalOpen() {
            return isFullscreenOpen
                || document.getElementById('customDialogOverlay').style.display === 'flex'
                || document.getElementById('allMemosView').style.display === 'flex'
                || document.getElementById('trashView').style.display === 'flex';
        }

        swipeArea.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            if (anyModalOpen()) { tracking = false; return; }
            if (isInteractiveTarget(e.target)) { tracking = false; return; }
            startX = e.clientX;
            startY = e.clientY;
            lastY = e.clientY;
            gestureMode = null;
            tracking = true;
        });

        window.addEventListener('pointermove', (e) => {
            if (!tracking) return;
            const totalDx = e.clientX - startX;
            const totalDy = e.clientY - startY;

            if (gestureMode === null && (Math.abs(totalDx) > LOCK_THRESHOLD || Math.abs(totalDy) > LOCK_THRESHOLD)) {
                if (activeTabId === 'tabCalendar' && Math.abs(totalDy) > Math.abs(totalDx)) {
                    gestureMode = 'calendar-vertical';
                } else {
                    gestureMode = Math.abs(totalDx) > Math.abs(totalDy) ? 'horizontal' : 'vertical';
                }
                if (gestureMode === 'vertical') suppressNextClick = true;
            }

            if (gestureMode === 'vertical') {
                const stepDy = e.clientY - lastY;
                window.scrollBy(0, -stepDy);
            }

            lastY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (!tracking) return;
            tracking = false;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (gestureMode === 'horizontal') {
                if (Math.abs(dx) >= THRESHOLD && Math.abs(dx) >= Math.abs(dy) * 1.3) {
                    const curIndex = tabOrder.indexOf(activeTabId);
                    let nextIndex = curIndex;
                    if (dx < 0 && curIndex < tabOrder.length - 1) nextIndex = curIndex + 1;
                    if (dx > 0 && curIndex > 0) nextIndex = curIndex - 1;

                    if (nextIndex !== curIndex) {
                        const nextTabId = tabOrder[nextIndex];
                        switchTab(nextTabId, tabTitles[nextTabId]);
                    }
                }
            } else if (gestureMode === 'calendar-vertical') {
                if (Math.abs(dy) >= THRESHOLD && Math.abs(dy) >= Math.abs(dx)) {
                    if (dy > 0) {
                        changeMonth(-1, 'down');
                    } else {
                        changeMonth(1, 'up');
                    }
                }
            }
            gestureMode = null;
        });

        window.addEventListener('pointercancel', () => { tracking = false; gestureMode = null; });
    }

    function initModalDragScroll() {
        const grid = document.getElementById('allMemosGrid');
        if (!grid) return;
        let dragging = false, lastY = 0, startY = 0;
        const LOCK_THRESHOLD = 6;
        let moved = false;

        grid.addEventListener('pointerdown', (e) => {
            dragging = true;
            moved = false;
            startY = e.clientY;
            lastY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const stepDy = e.clientY - lastY;
            if (!moved && Math.abs(e.clientY - startY) > LOCK_THRESHOLD) {
                moved = true;
                suppressNextClick = true;
            }
            if (moved) grid.scrollTop -= stepDy;
            lastY = e.clientY;
        });

        window.addEventListener('pointerup', () => { dragging = false; });
        window.addEventListener('pointercancel', () => { dragging = false; });
    }

    async function unlockApp() {
        const inputPwd = document.getElementById('appPasswordInput').value.trim();
        if (!inputPwd) {
            await customAlert(t('alertEnterPassword'));
            return;
        }

        const savedHash = localStorage.getItem('appPasswordHash');
        const inputHash = CryptoJS.SHA256(inputPwd).toString();

        if (!savedHash) {
            localStorage.setItem('appPasswordHash', inputHash);
            localStorage.setItem('backupPassword', inputPwd);
            loggedInPassword = inputPwd;
            openMainContainer();
            await customAlert(t('alertPasswordSetSuccess'));
        } else if (savedHash === inputHash) {
            loggedInPassword = inputPwd;
            openMainContainer();
        } else {
            await customAlert(t('alertPasswordWrong'));
            document.getElementById('appPasswordInput').value = '';
            document.getElementById('appPasswordInput').focus();
        }
    }

        const todayStr = new Date().toISOString().split('T')[0];
        if (localStorage.getItem('lastAutoBackupDate') === todayStr) return;

        await exportEncryptedHtml(true);
        localStorage.setItem('lastAutoBackupDate', todayStr);

    async function toggleAppLock() {
        const toggle = document.getElementById('appLockToggle');
        const savedHash = localStorage.getItem('appPasswordHash');

        if (!toggle.checked) {
            const pwd = await customPrompt(t('promptCurrentPasswordForLockOff'));
            if (pwd === null) {
                toggle.checked = true;
                return;
            }
            if (!savedHash || CryptoJS.SHA256(pwd).toString() !== savedHash) {
                await customAlert(t('alertPasswordMismatch'));
                toggle.checked = true;
                return;
            }
            appLockEnabled = false;
            localStorage.setItem('appLockEnabled', 'false');
            await customAlert(t('alertLockOffNotice'));

    function undoMemoText() {

        if (isFreeMemoMode || !selectedDateKey) return;

        saveMemoInternal();

        const d = new Date(selectedDateKey + 'T00:00:00');
        d.setDate(d.getDate() + offset);
        const newKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        openCalendarModal(newKey, true);

    function initCalendarMemoSwipe() {
        const view = document.getElementById('memoFullscreenView');
        let startX = 0, startY = 0, tracking = false, gestureMode = null;
        const THRESHOLD = 60;
        const LOCK_THRESHOLD = 12;

        view.addEventListener('pointerdown', (e) => {
            if (!isFullscreenOpen || isFreeMemoMode) { tracking = false; return; }
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            startX = e.clientX;
            startY = e.clientY;
            gestureMode = null;
            tracking = true;
        });

        window.addEventListener('pointermove', (e) => {
            if (!tracking) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (gestureMode === null && (Math.abs(dx) > LOCK_THRESHOLD || Math.abs(dy) > LOCK_THRESHOLD)) {
                gestureMode = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!tracking) return;
            tracking = false;
            if (gestureMode !== 'horizontal') return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.3) return;

            goToAdjacentCalendarDay(dx < 0 ? 1 : -1);
        });

        window.addEventListener('pointercancel', () => { tracking = false; gestureMode = null; });
    }

    function saveMemoInternal() {
        const content = document.getElementById('memoContentInput').value.trim();

        if (isFreeMemoMode) {
            if (content !== '') {
                const now = new Date();
                const nowStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

                if (selectedFreeMemoId !== null) {
                    const existingIndex = freeMemos.findIndex(m => m.id === selectedFreeMemoId);
                    if (existingIndex > -1) {
                        freeMemos[existingIndex].content = content;
                        freeMemos[existingIndex].date = nowStr;
                    }
                } else {
                    freeMemos.unshift({ id: Date.now(), content: content, date: nowStr });
                }
                localStorage.setItem('simpleFreeMemos', JSON.stringify(freeMemos));
            } else if (selectedFreeMemoId !== null) {
                freeMemos = freeMemos.filter(m => m.id !== selectedFreeMemoId);
                localStorage.setItem('simpleFreeMemos', JSON.stringify(freeMemos));
            }
            renderFreeMemos();
        } else if (selectedDateKey) {
            if (content === '') {
                delete memos[selectedDateKey];
            } else {
                memos[selectedDateKey] = content;
            }
            localStorage.setItem('simplePostitNotes', JSON.stringify(memos));
            renderCalendar();
        }

        if (document.getElementById('searchInput').value.trim()) searchMemos();
    }

    async function deleteMemo() {
        if (!(await customConfirm(t('confirmMoveToTrash')))) return;

        if (isFreeMemoMode && selectedFreeMemoId !== null) {
            const target = freeMemos.find(m => m.id === selectedFreeMemoId);
            if (target) {
                deletedMemos.unshift({ type: 'free', id: target.id, content: target.content, date: target.date });
            }
            freeMemos = freeMemos.filter(m => m.id !== selectedFreeMemoId);
            localStorage.setItem('simpleFreeMemos', JSON.stringify(freeMemos));
            renderFreeMemos();
        } else if (!isFreeMemoMode && selectedDateKey) {
            const content = memos[selectedDateKey];
            if (content) {
                deletedMemos.unshift({ type: 'calendar', key: selectedDateKey, content: content, date: selectedDateKey });
            }
            delete memos[selectedDateKey];
            localStorage.setItem('simplePostitNotes', JSON.stringify(memos));
            renderCalendar();
        }

        localStorage.setItem('simpleDeletedMemos', JSON.stringify(deletedMemos));
        renderTrash();

        isFullscreenOpen = false;
        document.getElementById('memoFullscreenView').style.display = 'none';
        if (window.history.state && window.history.state.fullscreenMemo) {
            history.back();

        if (document.getElementById('searchInput').value.trim()) searchMemos();
    }

    function extractSearchKeyword(raw) {
        let text = raw.trim();
        if (!text) return '';
        const looksLikeSentence = /(검색|찾아|보여|알려|라는|글자|단어|키워드|텍스트|문구|포함|들어간|들어있는)/.test(text);
        if (!looksLikeSentence) return text;
        let keyword = text;
        keyword = keyword.replace(/(을|를)?\s*(검색|찾아|보여|알려)\s*(해)?\s*(줘|줄래|줄래요|주라|주세요|봐줘|봐요|봐)?\.?\s*$/, '');
        keyword = keyword.replace(/(메모|노트|일정|내용)\s*(를|은|는|이|가|에|에서)?\s*$/, '');
        keyword = keyword.replace(/(들어\s*있는|들어간|포함된|포함하는|있는)\s*$/, '');
        keyword = keyword.replace(/(글자|단어|키워드|텍스트|문구)\s*(가|이)?\s*$/, '');
        keyword = keyword.replace(/(이)?라는\s*$/, '');
        return keyword.trim() || text;
    }

    function parseDateToken(rawToken) {
        const t = rawToken.trim().replace(/\.$/, '');
        let m = t.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
        if (m) {
            const mm = m[2].padStart(2, '0');
            const dd = m[3].padStart(2, '0');
            if (Number(mm) >= 1 && Number(mm) <= 12 && Number(dd) >= 1 && Number(dd) <= 31) {
                return { type: 'full', value: `${m[1]}-${mm}-${dd}` };
            }
        }
        m = t.match(/^(\d{1,2})[.\-\/](\d{1,2})$/);
        if (m) {
            const mm = m[1].padStart(2, '0');
            const dd = m[2].padStart(2, '0');
            if (Number(mm) >= 1 && Number(mm) <= 12 && Number(dd) >= 1 && Number(dd) <= 31) {
                return { type: 'monthday', value: `${mm}-${dd}` };
            }
        }
        return null;
    }

    function extractSearchKeywords(raw) {
        const text = raw.trim();
        if (!text) return { keywords: [], mode: 'AND', dateFilters: [] };
        const isOrMode = /또는|혹은|\bor\b/i.test(text);
        const initialTokens = text.split(/\s+/);
        const dateFilters = [];
        const remainingTokens = [];
        initialTokens.forEach(tok => {
            const parsed = parseDateToken(tok);
            if (parsed) dateFilters.push(parsed);
            else remainingTokens.push(tok);
        });
        const remainingText = remainingTokens.join(' ').trim();
        const core = remainingText ? extractSearchKeyword(remainingText) : '';
        const rawTokens = core.replace(/,/g, ' ').split(/\s+/).filter(Boolean);
        const conjunctions = new Set(['그리고', '와', '과', '이랑', '랑', '및', '또는', '혹은', 'or', 'OR']);
        const andFillers = new Set(['모두', '전부', '둘다', '다', '함께', '같이']);
        const keywords = rawTokens.filter(t => !conjunctions.has(t) && !andFillers.has(t));
        return { keywords: keywords, mode: isOrMode ? 'OR' : 'AND', dateFilters: dateFilters };
    }

    function dateMatchesFilters(dateStr, dateFilters) {
        if (!dateFilters || dateFilters.length === 0) return true;
        return dateFilters.some(f => {
            if (f.type === 'full') return dateStr === f.value;
            if (f.type === 'monthday') return dateStr.slice(5) === f.value;
            return false;
        });
    }

    function contentMatchesKeywords(content, keywords, mode) {
        if (!content) return false;
        const lower = content.toLowerCase();
        if (mode === 'OR') {
            return keywords.some(k => lower.includes(k.toLowerCase()));
        }
        return keywords.every(k => lower.includes(k.toLowerCase()));
    }

    function entryMatches(dateStr, content, keywords, mode, dateFilters) {
        if (!dateMatchesFilters(dateStr, dateFilters)) return false;
        if (keywords.length === 0) return true;
        return contentMatchesKeywords(content, keywords, mode);
    }

    function searchMemos() {
        const rawQuery = document.getElementById('searchInput').value.trim();
        const resultsContainer = document.getElementById('searchResults');
        const resultsList = document.getElementById('resultsList');
        const title = document.getElementById('searchResultTitle');

        if (!rawQuery) {
            resultsContainer.style.display = 'none';
            return;
        }

        const { keywords, mode, dateFilters } = extractSearchKeywords(rawQuery);
        if (keywords.length === 0 && dateFilters.length === 0) {
            resultsContainer.style.display = 'none';
            return;
        }

        const matchedResults = [];
        Object.keys(memos).sort().forEach(dateKey => {
            const content = memos[dateKey];
            if (entryMatches(dateKey, content, keywords, mode, dateFilters)) {
                matchedResults.push({ type: 'calendar', key: dateKey, date: dateKey, text: content });
            }
        });
        freeMemos.forEach(memo => {
            if (entryMatches(memo.date, memo.content, keywords, mode, dateFilters)) {
                matchedResults.push({ type: 'free', id: memo.id, date: memo.date, text: memo.content });
            }
        });

        resultsList.innerHTML = '';
        const labelParts = [];
        const orSeparators = { ko: '\' 또는 \'', en: '\' or \'', zh: '\' 或 \'', ja: '\' または \'' };
        if (keywords.length > 0) {
            const separator = mode === 'OR' ? (orSeparators[currentLang] || orSeparators.ko) : '\' + \'';
            labelParts.push(`'${keywords.map(k => escapeHtml(k)).join(separator)}'`);
        }
        if (dateFilters.length > 0) {
            const dateLabels = dateFilters.map(f => f.type === 'full' ? f.value : `${f.value.replace('-', '.')}.`);
            labelParts.push(dateLabels.join(', '));
        }
        const keywordLabel = labelParts.length > 0 ? `${labelParts.join(' · ')} ` : '';

        if (matchedResults.length > 0) {
            const countLabel = currentLang === 'ko'
                ? `${t('searchResultDefaultTitle')} (${matchedResults.length}건)`
                : `${t('searchResultDefaultTitle')} (${matchedResults.length})`;
            title.textContent = `${keywordLabel}${countLabel}`;
            matchedResults.forEach(item => {
                const row = document.createElement('div');
                row.className = 'result-item clickable';
                const isFree = item.type === 'free';
                row.innerHTML = `
                    <span class="item-text">${escapeHtml(item.text)}</span>
                    <span class="result-date">${escapeHtml(formatListDate(item.date))}</span>
                `;
                row.onclick = isFree ? () => openFreeMemoModal(item.id) : () => openCalendarModal(item.key);
                resultsList.appendChild(row);
            });
        } else {
            title.textContent = `${keywordLabel}${t('searchResultDefaultTitle')}`;
            resultsList.innerHTML = `<div style="color:var(--md-on-surface-variant); font-size:0.9rem; padding:10px 0; text-align:center;">${t('noSearchResults')}</div>`;
        }

        resultsContainer.style.display = 'block';
    }

    }

    async function exportEncryptedHtml(isAll = false) {
        let sortedKeys = Object.keys(memos).sort();
        let targetMemos = {};
        let targetFreeMemos = [...freeMemos];
        let rangeTitle = '';

        if (isAll) {
            targetMemos = { ...memos };
            const today = new Date().toISOString().split('T')[0];
            const firstKey = sortedKeys.length > 0 ? sortedKeys[0] : today;
            const lastKey = sortedKeys.length > 0 ? sortedKeys[sortedKeys.length - 1] : today;
            rangeTitle = `${firstKey} ~ ${lastKey}`;
        } else {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            if (!startDate && !endDate) {
                await customAlert(t('alertSelectDate'));
                return;
            }
            const start = startDate || endDate;
            const end = endDate || startDate;
            rangeTitle = `${start} ~ ${end}`;
            sortedKeys.filter(key => key >= start && key <= end).forEach(key => {
                targetMemos[key] = memos[key];
            });
        }

        if (Object.keys(targetMemos).length === 0 && targetFreeMemos.length === 0) {
            await customAlert(t('alertNoMemosToSave'));
            return;
        }

        const password = loggedInPassword || localStorage.getItem('backupPassword') || await customPrompt(t('promptBackupPassword'));
        if (!password) return;

        const payload = JSON.stringify({
            calendar: targetMemos,
            free: targetFreeMemos,
            range: rangeTitle
        });

        const encryptedData = CryptoJS.AES.encrypt(payload, password).toString();

        const standaloneHtml = `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>암호화 메모 백업 (${rangeTitle})</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"><\/script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; padding: 25px; color: #E6E1E5; }
        .box { max-width: 750px; margin: 0 auto; background: #000; padding: 30px; border: none; }
        .lock-box { text-align: center; padding: 20px; }
        input[type="password"] { padding: 10px; width: 220px; font-size: 1rem; border: none; border-bottom: 2px solid #49454F; border-radius: 0; text-align: center; background: transparent; color: #E6E1E5; }
        button { padding: 10px 18px; font-size: 1rem; background: #D0BCFF; color: #381E72; border: none; border-radius: 100px; cursor: pointer; font-weight: bold; }
        pre { white-space: pre-wrap; word-break: break-all; font-family: inherit; font-size: 0.95rem; line-height: 1.5; color: #E6E1E5; }
    </style>
</head>
<body>
<div class="box">
    <div id="pwdZone" class="lock-box">
        <h3>🔒 암호화된 메모 백업 파일</h3>
        <p>복호화 비밀번호를 입력해 주세요.</p>
        <input type="password" id="p" placeholder="비밀번호" onkeyup="if(event.key==='Enter') decrypt()">
        <button onclick="decrypt()">확인</button>
    </div>
    <div id="viewZone" style="display:none;">
        <pre id="textOutput"></pre>
    </div>
</div>
<script>
    const encrypted = "${encryptedData}";
    function decrypt() {
        const pwd = document.getElementById('p').value;
        try {
            const bytes = CryptoJS.AES.decrypt(encrypted, pwd);
            const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
            if(!decryptedStr) throw new Error();
            const data = JSON.parse(decryptedStr);
            
            let out = "";
            
            const keys = Object.keys(data.calendar || {}).sort();
            if (keys.length > 0) {
                out += "========================================\\n";
                out += " 📅 달력 메모 (" + (data.range || "") + ")\\n";
                out += "========================================\\n\\n";
                keys.forEach(k => {
                    if(data.calendar[k]) {
                        out += "[" + k + "]\\n" + data.calendar[k] + "\\n\\n----------------------------------------\\n\\n";
                    }
                });
            }

            if(data.free && data.free.length > 0) {
                out += "========================================\\n";
                out += " 📝 메모 목록\\n";
                out += "========================================\\n\\n";
                data.free.forEach(m => {
                    out += "[" + m.date + "]\\n" + m.content + "\\n\\n----------------------------------------\\n\\n";
                });
            }

            document.getElementById('pwdZone').style.display = 'none';
            document.getElementById('textOutput').textContent = out;
            document.getElementById('viewZone').style.display = 'block';
        } catch(e) {
            alert('비밀번호가 올바르지 않습니다.');
        }
    }
<\/script>
<!-- RESTORE_DATA:${encryptedData} -->
</body>
</html>`;

        const fileNamePrefixes = { ko: '메모백업', en: 'notes-backup', zh: '备忘录备份', ja: 'メモバックアップ' };
        const prefix = fileNamePrefixes[currentLang] || fileNamePrefixes.ko;
        const blob = new Blob([standaloneHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${prefix}_${rangeTitle.replace(/[\s~]+/g, '_')}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function importMemosFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const content = e.target.result;
            let encryptedStr = null;

            const match = content.match(/<!--\s*RESTORE_DATA:(.*?)\s*-->/);
            if (match && match[1]) {
                encryptedStr = match[1];
            } else if (file.name.endsWith('.txt')) {
                await customAlert(t('alertInvalidBackupFile'));
                return;
            } else {
                encryptedStr = content;
            }

            const pwd = await customPrompt(t('promptDecryptPassword'));
            if (!pwd) return;

            try {
                const bytes = CryptoJS.AES.decrypt(encryptedStr, pwd);
                const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedStr) throw new Error();
                const data = JSON.parse(decryptedStr);

                const merge = await customConfirm(t('confirmMergeBackup'));
                if (merge) {
                    if (data.calendar) {
                        Object.keys(data.calendar).forEach(k => {
                            memos[k] = data.calendar[k];
                        });
                        localStorage.setItem('simplePostitNotes', JSON.stringify(memos));
                    }
                    if (data.free && Array.isArray(data.free)) {
                        const existingIds = new Set(freeMemos.map(m => m.id));
                        data.free.forEach(m => {
                            if (!existingIds.has(m.id)) {
                                freeMemos.push(m);
                            }
                        });
                        localStorage.setItem('simpleFreeMemos', JSON.stringify(freeMemos));
                    }
                } else {
                    if (data.calendar) {
                        memos = data.calendar;
                        localStorage.setItem('simplePostitNotes', JSON.stringify(memos));
                    }
                    if (data.free && Array.isArray(data.free)) {
                        freeMemos = data.free;
                        localStorage.setItem('simpleFreeMemos', JSON.stringify(freeMemos));
                    }
                }

                renderCalendar();
                renderFreeMemos();
                renderTrash();
                await customAlert(t('alertRestoreSuccess'));
            } catch (err) {
                await customAlert(t('alertWrongPasswordOrCorrupt'));
            }
        };
        reader.onerror = async function() {
            await customAlert(t('alertFileLoadError'));
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function formatListDate(dateStr) {
        if (!dateStr) return '';
        if (currentLang === 'en') {
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[1]}/${parts[2]}/${parts[0]}`;
        }
        return dateStr.replace(/-/g, '.');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function changeMonth(offset, mode = 'horizontal') {
        currentDate.setMonth(currentDate.getMonth() + offset);
        renderCalendar();

        const grid = document.getElementById('calendarGrid');
        if (!grid) return;
        const animClass = mode === 'up' ? 'slide-from-bottom' : mode === 'down' ? 'slide-from-top' : (offset > 0 ? 'slide-from-right' : 'slide-from-left');
        grid.classList.remove('slide-from-right', 'slide-from-left', 'slide-from-bottom', 'slide-from-top');
        void grid.offsetWidth;
        grid.classList.add(animClass);
        grid.addEventListener('animationend', function handler() {
            grid.classList.remove('slide-from-right', 'slide-from-left', 'slide-from-bottom', 'slide-from-top');
            grid.removeEventListener('animationend', handler);
        });
    }

    async function pickYear() {
        const currentYear = currentDate.getFullYear();
        const yearInput = await customTextPrompt(t('promptYear'), String(currentYear));
        if (yearInput === null) return;
        const targetYear = parseInt(yearInput.trim(), 10);
        if (isNaN(targetYear) || targetYear < 1900 || targetYear > 2100) {
            await customAlert(t('alertInvalidYear'));
            return;
        }
        currentDate.setFullYear(targetYear);
        renderCalendar();
    }
</script>
</body>
</html>
